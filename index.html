<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSE CHEMISTRY QUESTIONBANK ( SORTED BY CHAPTER )</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX CSS & JS (含 mhchem 化學式擴展) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/mhchem.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // 設定 PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- 自定義樣式 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 頂部標題列 -->
  <header class="top-nav">
    <div class="nav-left">
      <h1 class="nav-title">DSE CHEMISTRY QUESTIONBANK ( SORTED BY CHAPTER )</h1>
      <span class="nav-badge">按課題 · 按章編排</span>
    </div>
    <div class="nav-right">
      <!-- 語言切換按鈕 -->
      <div class="lang-switch-wrap">
        <button id="langBtnC" class="lang-btn active" data-lang="c">中文卷 (C)</button>
        <button id="langBtnE" class="lang-btn" data-lang="e">英文卷 (E)</button>
      </div>
      <span class="question-count" id="totalQuestionsCount">共 0 題</span>
      
      <div class="action-buttons">
        <label for="pdfUploadInput" class="btn btn-primary" title="上傳包含題目的 PDF">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          匯入 PDF
        </label>
        <input type="file" id="pdfUploadInput" accept="application/pdf" multiple style="display: none;" />

        <button id="exportBtn" class="btn btn-secondary">匯出 JSON</button>
        <label for="importJsonInput" class="btn btn-secondary">匯入 JSON</label>
        <input type="file" id="importJsonInput" accept=".json" style="display: none;" />
        <button id="resetDataBtn" class="btn btn-danger-outline" title="清除所有資料">重設</button>
      </div>
    </div>
  </header>

  <!-- 狀態提示框 (Toast) -->
  <div id="toast" class="toast hidden"></div>

  <!-- 主佈局容器 -->
  <div class="app-container">
    
    <!-- 左側邊欄 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">十五課題</span>
        <div class="sidebar-actions">
          <button id="expandAllBtn" class="btn-text">全部展開</button>
          <span class="divider">|</span>
          <button id="collapseAllBtn" class="btn-text">全部收起</button>
        </div>
      </div>
      <div class="sidebar-content" id="topicListContainer">
        <!-- 課題與章節樹狀清單由 app.js 動態生成 -->
      </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="main-content">
      
      <!-- 總目錄首頁視圖 -->
      <section id="dashboardView" class="view-panel active">
        <div class="section-desc">
          左側點 <kbd>+</kbd> 展開該課題下的章，點章名直接跳到該章 · 點 A–D 直接判對錯 · <span id="generateDate">生成日期：2026-11-11</span>
        </div>

        <!-- 3 個數字概覽卡片 -->
        <div class="stat-cards-grid">
          <div class="stat-card">
            <span class="stat-label">課題總數</span>
            <div class="stat-val">15</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">課程章節</span>
            <div class="stat-val">65</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">題目總數</span>
            <div class="stat-val" id="dashTotalQuestions">0</div>
          </div>
        </div>

        <!-- 練習進度區塊 -->
        <div class="dashboard-section">
          <h2 class="sub-heading">練習進度</h2>
          <div class="progress-stats-grid">
            <div class="progress-box">
              <span class="pb-label">已作答</span>
              <span class="pb-val" id="answeredCount">0</span>
            </div>
            <div class="progress-box progress-box-wide">
              <div class="pb-header">
                <span class="pb-label">掌握率</span>
                <span class="pb-val-sm" id="masteryRate">0%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="masteryFill" style="width: 0%;"></div>
              </div>
            </div>
            <div class="progress-box">
              <span class="pb-label">錯題數</span>
              <span class="pb-val danger-text" id="wrongCount">0</span>
            </div>
            <div class="progress-box">
              <span class="pb-label">今日作答</span>
              <span class="pb-val primary-text" id="todayAnsweredCount">0</span>
            </div>
          </div>
        </div>

        <!-- 最近 12 週練習熱力圖 -->
        <div class="dashboard-section">
          <div class="section-title-wrap">
            <h2 class="sub-heading">最近 12 週練習記錄</h2>
            <span class="sub-label">記錄每日練習活躍度</span>
          </div>
          <div class="heatmap-container">
            <div id="heatmapGrid" class="heatmap-grid">
              <!-- 熱力圖方塊由 app.js 生成 -->
            </div>
            <div class="heatmap-legend">
              <span>Less</span>
              <span class="legend-cell lv-0"></span>
              <span class="legend-cell lv-1"></span>
              <span class="legend-cell lv-2"></span>
              <span class="legend-cell lv-3"></span>
              <span>More</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 章節題目作答視圖 -->
      <section id="chapterView" class="view-panel">
        <div class="chapter-header">
          <div class="breadcrumb">
            <button id="backToHomeBtn" class="breadcrumb-link">十五課題總目錄</button>
            <span class="separator">/</span>
            <span id="bcTopicName">CHEM-01 地球</span>
            <span class="separator">/</span>
            <span id="bcChapterName" class="current">第 1 章</span>
          </div>
          <h2 id="currentChapterTitle" class="chapter-title">第 1 章：大氣層與氣體</h2>
          <div class="chapter-meta">
            <span id="chapterStats">共 0 題</span>
          </div>
        </div>

        <!-- 題目列表清單 -->
        <div id="questionList" class="question-list">
          <!-- 題目卡片由 app.js 動態渲染 -->
        </div>
      </section>

    </main>
  </div>

  <!-- 自定義浮動 Tooltip (給熱力圖使用) -->
  <div id="customTooltip" class="custom-tooltip"></div>

  <!-- 外部套件與腳本載入區 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
<script src="app.js"></script>
